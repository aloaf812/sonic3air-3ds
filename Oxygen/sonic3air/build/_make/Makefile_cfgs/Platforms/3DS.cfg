APP_TITLE = Sonic 3 A.I.R.

STATIC = 1

include $(DEVKITARM)/3ds_rules
PKGCONFIG =	$(PORTLIBS)/bin/arm-none-eabi-pkg-config

CFLAGS += -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft \
          -D__3DS__ -g -Wl,--allow-multiple-definition -mword-relocations -ffunction-sections
LIBPATHS +=	-L$(CTRULIB)/lib
INCLUDES += -I$(CTRULIB)/include \
            -I$(PORTLIBS)/include \
            -I$(PORTLIBS)/include/SDL2 \
            -I$(DEVKITPRO)/portlibs/3ds/include